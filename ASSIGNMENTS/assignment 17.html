<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Attributes and Input Validation</title>
</head>
<body>
  <h3 style="color:green;">Output</h3>

    <div style="border:1px solid lightgreen; padding:30px 65px;">

        <form method="POST" action="submit.php">

            <input type="text" name="fullname"
            placeholder="Full name" required>

            <br><br>

            <input type="email" name="email"
            placeholder="you@college.edu" required>

            <br><br>

            <input type="tel" name="mobile"
            placeholder="10-digit mobile"
            pattern="[0-9]{10}" required>

            <br><br>

            <input type="password" name="password"
            placeholder="Min 6 characters"
            minlength="6" maxlength="12" required>

            <br><br>

            <input type="number" name="age"
            placeholder="Age (17-30)"
            min="17" max="30" required>

            <br><br>

            <button type="submit">Register</button>

        </form>

    </div>   
</body>
</html>
