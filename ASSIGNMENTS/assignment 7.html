<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu Using Lists</title>
</head>
<body>

    <style>
        ul {
            background-color: #333;
            padding: 15px;
            list-style: none;
        }

        li {
            display: inline;
            margin: 20px;
            color: white;
        }
    </style>
</head>

<body>

    <ul>
        <li>Home</li>
        <li>About</li>
        <li>Courses</li>
        <li>Contact</li>
    </ul>

</body>
</html>
