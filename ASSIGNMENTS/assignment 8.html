<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks and Images with Attributes</title>
</head>
<body>
    <p id="top">Links demo</p>

    <a href="https://www.google.com" target="_blank">External link</a>
    <br>

    <a href="#bottom">Jump to bottom</a>
    <br>

    <a href="mailto:example@gmail.com">Email us</a>
    <br>

    <a href="https://www.google.com">
        <img src="logo.png" alt="Logo" width="120" height="60">
    </a>

    <br><br><br><br><br><br><br><br><br><br>

    <p id="bottom">
        Bottom. <a href="#top">Back to top</a>
    </p>

</body>
</html>
