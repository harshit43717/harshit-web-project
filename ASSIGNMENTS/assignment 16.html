<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>select,text area,and button</title>
</head>
<body>
     <h3 style="color:green;">Output</h3>

    <div style="border:1px solid lightgreen; padding:30px 70px;">

        <form>
            <label>Course:</label>

            <select>
                <option>ECE</option>
                <option>CSE</option>
                <option>ME</option>
                <option>CE</option>
            </select>

            <br><br>

            <label>Feedback:</label>
            <br>

            <textarea rows="5" cols="50"
            placeholder="Write here..."></textarea>

            <br><br>

            <button type="submit">Submit</button>

            <button type="reset">Reset</button>

            <button type="button">Click Me</button>

        </form>

    </div>
</body>
</html>
