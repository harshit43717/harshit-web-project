<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>: Multimedia: Image, Video, Audio and YouTube</title>
</head>
<body>

    <h3>Image</h3>
    <img src="campus.jpg" alt="College campus" width="200" height="200">

    <h3>Video</h3>
    <video width="250" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <h3>Audio</h3>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <h3>YouTube</h3>
    <iframe width="350" height="200"
        src="https://www.youtube.com/embed/VIDEO_ID">
    </iframe>

</body>
</html>
